# Model-checks `mpc/src/honeybadger/dabit/packing.rs` and `mpc/src/common/gf2k/field.rs` with
# Kani, compiling those files directly.
# Deliberately outside the workspace: Kani cannot build the full dependency tree of the main
# crate, and these harnesses need none of it.
[package]
name = "dabit-packing-kani"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Only what `gf2k/field.rs` itself imports.
serde = { version = "1.0.219", features = ["derive"] }
ark-std = "0.5.0"
num-bigint = "0.4"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }

[workspace]
